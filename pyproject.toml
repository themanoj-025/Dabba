[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dabba"
version = "0.2.0"
description = "India-focused restaurant ranking, recommendation, and delivery-reliability platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",  # trained model artifacts pickle BitGenerators via numpy.random._mt19937 (numpy 2.x)
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<1.9",  # pinned <1.9: trained model artifacts reference sklearn._loss (removed in 1.9)
    "joblib>=1.3,<2.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.0,<5.0",
    "catboost>=1.2,<2.0",
    "torch>=2.0,<3.0",
    "faiss-cpu>=1.7,<2.0",
    "nltk>=3.8,<4.0",
    "anthropic>=0.100,<1.0",
    "fastapi>=0.141.1,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "slowapi>=0.1.9,<1.0",
    "PyJWT>=2.8,<3.0",
    "streamlit>=1.28,<2.0",
    "plotly>=5.18,<6.0",
    "matplotlib>=3.7,<4.0",
    "folium>=0.15,<1.0",
    "seaborn>=0.13,<1.0",
    "shap>=0.43,<1.0",
    "mlflow>=2.0,<4.0",
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.1,<1.0",
    "black>=23.11,<25.0",
    "isort>=5.12,<6.0",
    "kaggle>=1.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
    "optuna>=3.4,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
# black (line-length 88) is the enforced formatter; E501 duplicates it and
# only fires on docstrings/comments/strings. ruff's recommended black setup.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idioms: Depends() in argument defaults and the injected `request`
# param are required by the framework, not lint violations.
"api/**/*.py" = ["B008", "ARG001"]
"app/**/*.py" = ["B007", "B008", "ARG001"]
# scikit-learn convention: X (feature matrix), y, C, R are standard names.
"src/dabba/models/**/*.py" = ["N803", "N806", "ARG001"]
"src/dabba/features/**/*.py" = ["N803", "ARG001"]
"src/dabba/pipeline.py" = ["N803", "N806"]
"tests/**/*.py" = ["N803", "N806", "ARG002"]
# Decorator shims that intentionally forward *args/**kwargs.
"src/dabba/observability/__init__.py" = ["ARG001", "ARG002"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
