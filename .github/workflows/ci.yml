name: CI

permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check src/ tests/ --output-format=github
      - name: Format check with ruff
        run: ruff format --check src/ tests/

  lint-and-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout

      - name: Run pre-commit checks
        run: |
          pip install pre-commit
          pre-commit run --all-files

      - name: Run unit tests (excludes slow training/transformers tests)
        run: |
          pytest tests/ -v --tb=short --timeout=60 \
            --ignore=tests/e2e \
            --ignore=tests/integration \
            --ignore=tests/test_db_loaders.py \
            --ignore=tests/test_eta_model.py \
            --ignore=tests/test_rating_model.py \
            --ignore=tests/test_optuna_tuning.py \
            --ignore=tests/test_hinglish_sentiment.py \
            -k "not optuna and not train and not full_import" \
            --cov=src/dabba --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t dabba-api:ci .

      - name: Build Streamlit image
        run: docker build -f docker/streamlit.Dockerfile -t dabba-ui:ci .

      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dabba-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - name: Type check with mypy
        run: mypy . --ignore-missing-imports

  security-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
          cache: pip
        with:
          python-version: '3.12'
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r src/dabba -ll

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
